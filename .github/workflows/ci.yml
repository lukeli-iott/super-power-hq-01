name: CI & Deploy to HuggingFace

concurrency:
  group: hf-space-deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CI_SETUP.md'
      - 'STREAMLIT_MIGRATION.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'CI_SETUP.md'
      - 'STREAMLIT_MIGRATION.md'
      - '.gitignore'
      - '.dockerignore'
      - 'Dockerfile'
      - 'templates/**'
      - 'static/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Lint app and tests with ruff
        run: |
          pip install ruff
          ruff check app.py tests

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Flask app and tests
        run: |
          python -m py_compile app.py
          python -m py_compile tests/test_app.py
          python -m unittest discover -s tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for HuggingFace
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: Add HuggingFace Space remote
        run: |
          git remote add space https://oauth2:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/uklukie/super-power-hq

      - name: Push to HuggingFace Space
        run: |
          git push space main --force
          echo "✓ Deployed to HuggingFace Space"
